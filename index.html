<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RETROID // WAR SIM</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #07090c;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      #stage canvas { display: block; image-rendering: pixelated; }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center;
        gap: 14px; text-align: center; color: #9fb4c7; letter-spacing: 2px;
        font-size: 12px; text-transform: uppercase; z-index: 20;
        background: #07090c; transition: opacity .5s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: 22px; color: #e8c46a; letter-spacing: 6px; }
      #bar { width: 320px; height: 8px; border: 1px solid #2c3a48; background: #0d1218; }
      #bar > i { display: block; height: 100%; width: 0%; background: #e8c46a; transition: width .12s linear; }
      #boot-msg { color: #4f6a7b; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="boot">
      <h1>RETROID WAR SIM</h1>
      <div id="bar"><i></i></div>
      <div id="boot-msg">booting</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
